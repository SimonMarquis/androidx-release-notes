name: 📸 Screenshot
description: Capture light and dark Chromium screenshots of a local HTML page
inputs:
  page:
    description: HTML file to capture
    required: true
  output:
    description: Directory receiving <device>-<theme>.png files
    required: true
  devices:
    description: Space-separated devices (desktop, tablet, smartphone)
    default: desktop tablet smartphone
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PAGE: ${{ inputs.page }}
        OUTPUT: ${{ inputs.output }}
        DEVICES: ${{ inputs.devices }}
      run: |
        set -euo pipefail
        mkdir -p "$OUTPUT"
        for device in $DEVICES; do
          case "$device" in
            desktop)    width=1440; height=900; dpr=2 ;;
            tablet)     width=820; height=1180; dpr=2 ;;
            smartphone) width=402; height=874; dpr=3 ;;
            *) echo "Unknown device: $device" >&2; exit 1 ;;
          esac

          for theme in light dark; do
            dark_mode=""
            [[ "$theme" == dark ]] && dark_mode=--force-dark-mode

            chromium \
              --headless \
              --no-sandbox \
              --no-first-run \
              --disable-gpu \
              --enable-features=OverlayScrollbar:mode/overlay \
              --hide-scrollbars \
              --force-device-scale-factor="$dpr" \
              --window-size="$width,$height" \
              --virtual-time-budget=2000 \
              $dark_mode \
              --screenshot="$OUTPUT/$device-$theme.png" \
              "file://$(realpath "$PAGE")"
          done
        done
