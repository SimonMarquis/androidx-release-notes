name: Minify Pages assets
description: Minify the linked site assets and generate source maps.
inputs:
  esbuild-version:
    description: esbuild version to run
    default: '0.25.12'
outputs:
  javascript:
    description: Minified JavaScript path
    value: ${{ steps.minify.outputs.javascript }}
  stylesheet:
    description: Minified CSS path
    value: ${{ steps.minify.outputs.stylesheet }}
runs:
  using: composite
  steps:
    - id: minify
      shell: bash
      env:
        ESBUILD_VERSION: ${{ inputs.esbuild-version }}
      run: |
        set -euo pipefail
        npx --yes "esbuild@$ESBUILD_VERSION" docs/assets/site.js --minify --sourcemap --outfile=docs/assets/site.min.js
        npx --yes "esbuild@$ESBUILD_VERSION" docs/assets/site.css --minify --sourcemap --outfile=docs/assets/site.min.css
        echo 'javascript=docs/assets/site.min.js' >> "$GITHUB_OUTPUT"
        echo 'stylesheet=docs/assets/site.min.css' >> "$GITHUB_OUTPUT"
