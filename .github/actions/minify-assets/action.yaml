name: Minify Pages assets
description: Minify the linked site assets and generate source maps.
outputs:
  javascript:
    description: Minified JavaScript path
    value: ${{ steps.minify.outputs.javascript }}
  stylesheet:
    description: Minified CSS path
    value: ${{ steps.minify.outputs.stylesheet }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - id: minify
      shell: bash
      run: |
        set -euo pipefail
        npm ci --include=dev
        ./node_modules/.bin/esbuild docs/assets/site.js --minify --sourcemap --outfile=docs/assets/site.min.js
        ./node_modules/.bin/esbuild docs/assets/site.css --minify --sourcemap --outfile=docs/assets/site.min.css
        echo 'javascript=docs/assets/site.min.js' >> "$GITHUB_OUTPUT"
        echo 'stylesheet=docs/assets/site.min.css' >> "$GITHUB_OUTPUT"
