name: 🧭 Drift sync

on:
  schedule:
    - cron: '0 12 * * 0' # Weekly, on Sunday (12:00 UTC)
  workflow_dispatch:

concurrency:
  group: androidx-release-notes-sync
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  drift-sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRANCH: automation/drift-sync
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java

      - run: ./scripts/androidx-release-notes.main.kts sync all-channel 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 🔎 Detect changes
        id: changes
        run: |
          git add -A -- data
          if git diff --cached --quiet -- data; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - uses: SimonMarquis/setup-github-app-as-bot@v1
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: 📡 Create PR
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          TITLE: 🧭 Drift sync
        run: |
          git commit -m "$TITLE" -- data
          git push --force origin "HEAD:refs/heads/$BRANCH"

          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" \
              --json state --jq '.state' 2>/dev/null | grep -qx OPEN; then
            echo "::notice::PR already exists"; exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body "" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --assignee "$GITHUB_TRIGGERING_ACTOR"

      - name: 🧹 Close stale PR and delete branch
        if: steps.changes.outputs.changed == 'false'
        run: gh pr close "$BRANCH" --repo "$GITHUB_REPOSITORY" --delete-branch || true
