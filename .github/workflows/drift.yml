name: 🧭 Drift sync

on:
  schedule:
    - cron: '0 12 * * 0' # Weekly, on Sunday (12:00 UTC)
  workflow_dispatch:

concurrency:
  group: androidx-release-notes-sync
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  drift-sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java

      - run: ./scripts/androidx-release-notes.main.kts sync all-channel 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: SimonMarquis/setup-github-app-as-bot@v1
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: 📡 Create PR
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: automation/drift-sync
          TITLE: 🧭 Drift sync
        run: |
          git add -A -- data

          if git diff --cached --quiet --exit-code -- data; then
            echo "::notice::UP-TO-DATE"; exit 0
          fi

          git commit -m "$TITLE" -- data
          git push --force origin "HEAD:refs/heads/$BRANCH"

          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" \
              --json state --jq '.state' 2>/dev/null | grep -qx OPEN; then
            echo "::notice::PR already exists"; exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body "" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --assignee "$GITHUB_TRIGGERING_ACTOR"
