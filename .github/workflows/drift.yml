name: 🧭 Drift correction

on:
  schedule:
    - cron: '23 4 * * 1' # Weekly, on Monday (UTC)
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/**
      - .github/actions/setup-java/action.yaml
      - .github/workflows/drift.yml

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('androidx-drift-pr-{0}', github.event.pull_request.number) || 'androidx-release-notes-sync' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  fix-drift:
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java

      - name: Test drift reconciliation
        run: ./scripts/test-drift.sh

      - name: Reconcile official release histories
        run: ./scripts/androidx-release-notes.main.kts fix-drift

      - name: Log produced diff
        id: diff
        run: |
          git add --intent-to-add -- data
          git diff --stat -- data
          git diff --no-ext-diff -- data
          if git diff --quiet -- data; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # PR runs only test and log the diff. Publishing is enabled on main after merge.
      - id: github-app
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: SimonMarquis/setup-github-app-as-bot@v1
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update drift correction PR
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ steps.github-app.outputs.token }}
          CHANGED: ${{ steps.diff.outputs.changed }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: automation/changelog-drift
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ "$CHANGED" != true ]]; then
            if [[ -n "$pr" ]]; then
              gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --comment 'The latest full reconciliation found no remaining changelog drift.'
            fi
            exit 0
          fi

          # Refresh from this run's default-branch checkout, without overwriting a concurrent push.
          expected=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)
          git add -- data
          stats=$(git diff --cached --stat -- data)
          git commit -m '🤖 Fix changelog drift'
          push=true
          if [[ -n "$expected" ]]; then
            git fetch origin "$BRANCH"
            # Avoid pushing a new commit when the existing correction has identical data.
            if git diff --quiet FETCH_HEAD HEAD -- data; then
              push=false
            fi
          fi
          if [[ "$push" == true ]]; then
            git push --force-with-lease="refs/heads/$BRANCH:$expected" origin "HEAD:refs/heads/$BRANCH"
          fi

          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          cat > "$body" <<BODY
          Reconcile registered AndroidX components with their complete official release histories.

          Refresh changed changelogs and commit links, and restore missing versions. Ignored entries and feed metadata are preserved.

          Generated by [Drift correction]($RUN_URL).

          \`\`\`
          $stats
          \`\`\`
          BODY
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title '🤖 Fix changelog drift' --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$BRANCH" --title '🤖 Fix changelog drift' --body-file "$body"
          fi
