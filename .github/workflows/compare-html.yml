name: Compare HTML formatting
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/minify-assets
      - name: Generate and compare
        shell: bash
        run: |
          set -eu
          ./scripts/androidx-release-notes.main.kts build-site --minified
          cp docs/index.html /tmp/pretty.html
          sed -i 's/createHTML(prettyPrint = true)/createHTML(prettyPrint = false)/' scripts/androidx-release-notes.main.kts
          ./scripts/androidx-release-notes.main.kts build-site --minified
          cp docs/index.html /tmp/compact.html
          gzip -n -9 -c /tmp/pretty.html > /tmp/pretty.html.gz
          gzip -n -9 -c /tmp/compact.html > /tmp/compact.html.gz
          wc -c /tmp/pretty.html /tmp/compact.html /tmp/pretty.html.gz /tmp/compact.html.gz
