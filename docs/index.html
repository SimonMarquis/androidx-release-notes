<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1b1e22" media="(prefers-color-scheme: dark)">
<base target="_blank">
    <title>AndroidX Release Notes</title>
    <meta name="description" content="Browse AndroidX release notes across libraries and dates in one place.">
    <link href="https://simonmarquis.github.io/androidx-release-notes/" rel="canonical">
    <link href="assets/favicon.svg" rel="icon" type="image/svg+xml">
    <link href="assets/site.css" rel="stylesheet">
    <script src="assets/theme.js"></script>
  </head>
  <body data-date-navigation="true">
    <header class="site-header">
      <div class="header-inner"><a href="#" class="brand" target="_self"><span class="brand-name">AndroidX</span><span class="brand-subtitle">Release Notes</span></a>
        <div class="header-filters" role="group" aria-label="Filter by stability"><button type="button" class="filter-btn stable" data-filter="stable" aria-pressed="false">Stable</button><button type="button" class="filter-btn rc" data-filter="rc" aria-pressed="false">RC</button><button type="button" class="filter-btn beta" data-filter="beta" aria-pressed="false">Beta</button><button type="button" class="filter-btn alpha" data-filter="alpha" aria-pressed="false">Alpha</button></div>
<span class="loader" aria-hidden="true"></span>
        <div class="search-control"><label class="search-icon" for="release-search" title="Search"></label><input type="search" name="release-search" id="release-search" placeholder="Name, version, date…" autocomplete="off" aria-label="Filter components by name, version or date"></div>
<button type="button" class="theme-toggle" id="theme-toggle" title="Toggle theme"></button><a href="https://github.com/SimonMarquis/androidx-release-notes" class="github-link" title="View project on GitHub"></a></div>
    </header>
    <main class="page-content">
      <div class="content-inner">
        <div class="release-groups"></div>
      </div>
    </main>
    <script src="assets/site.js"></script>
  </body>
</html>
